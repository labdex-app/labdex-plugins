# The labdex official Marketplace: every plugin here lives in its own repository;
# its signed releases are the versions.
name: labdex official
description: Official labdex plugins, signed with the labdex project key
# Every public repository of labdex-app named labdex-plugin-* is included (a new one shows
# up by itself).
discover:
  - {owner: labdex-app, prefix: labdex-plugin-}
# List a repository only to withdraw a version:
#   - {repo: labdex-app/labdex-plugin-x, withdrawn: {"1.2": "why"}}
plugins: []
